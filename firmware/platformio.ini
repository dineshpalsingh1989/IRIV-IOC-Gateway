; IRIV IO Controller LAN gateway: Modbus TCP server, MQTT, RS485 Modbus RTU master.
; Build: pio run        Upload settings: put ioc_config.json in data/, then pio run -t uploadfs
[platformio]
default_envs = cytron_iriv_io_controller

[env:cytron_iriv_io_controller]
; Same platform pin as the Wilcoxon IRIV IOC gateway (profile.ini).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = cytron_iriv_io_controller
framework = arduino
board_build.core = earlephilhower
; 1 MB program, 1 MB LittleFS for ioc_config.json.
board_build.filesystem_size = 1m
lib_ldf_mode = chain+
lib_deps = bblanchon/ArduinoJson @ ^6.21.3
monitor_speed = 115200
