<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
  <title id="t">Our own libraries</title>
  <desc id="d">Four library cards: IRIVModbus (new), IRIVIOCIo (new), IRIVIOCHardware (extended) and WilcoxonMqtt (ours, unchanged), each with what it does.</desc>
  <defs>
    <style>
      .ink{stroke:#1d2926;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#1d2926;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .h{font-family:'Comic Sans MS','Chalkboard SE','Comic Neue',cursive;font-weight:700;fill:#1d2926}
      .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#34423c}
      .m{font-family:Consolas,'Courier New',monospace;fill:#5a6862}
    </style>
  </defs>
  <rect x="4" y="4" width="1192" height="422" rx="30" fill="#fbf8ef" class="ink"/>
  <text x="600" y="54" text-anchor="middle" class="h" font-size="30">Built on our own libraries</text>

  <!-- card 1 -->
  <g transform="translate(36 80)">
    <rect width="264" height="318" rx="20" fill="#fff" class="ink"/>
    <rect x="0" y="0" width="264" height="96" rx="20" fill="#e8f2eb" class="ink"/>
    <rect x="16" y="70" width="232" height="26" fill="#e8f2eb"/>
    <g transform="translate(58 48)"><rect x="-26" y="-20" width="52" height="40" rx="8" fill="#fff" class="thin"/><path d="M-12 -6 h24 l-8 -8 M12 6 h-24 l8 8" fill="none" class="thin" stroke="#24775a"/></g>
    <rect x="160" y="22" width="80" height="28" rx="14" fill="#3fae6a" class="thin"/><text x="200" y="42" text-anchor="middle" class="h" font-size="16" style="fill:#fff">NEW</text>
    <text x="22" y="134" class="h" font-size="24">IRIVModbus</text>
    <text x="22" y="156" class="m" font-size="14">0.1.0-alpha.1</text>
    <g class="b" font-size="16"><text x="22" y="192">• Modbus TCP server</text><text x="22" y="220">• RS485 RTU master</text><text x="22" y="248">• FC 01–06, 15, 16</text><text x="22" y="276">• sparse map + hooks</text><text x="22" y="304">• PC-testable core</text></g>
  </g>
  <!-- card 2 -->
  <g transform="translate(320 80)">
    <rect width="264" height="318" rx="20" fill="#fff" class="ink"/>
    <rect x="0" y="0" width="264" height="96" rx="20" fill="#ecf0f8" class="ink"/>
    <rect x="16" y="70" width="232" height="26" fill="#ecf0f8"/>
    <g transform="translate(58 52)"><circle r="24" fill="#fff" class="thin"/><path d="M-16 6 A18 18 0 0 1 4 -17" fill="none" stroke="#4d6596" stroke-width="6"/><path d="M0 4 L12 -10" class="thin"/></g>
    <rect x="160" y="22" width="80" height="28" rx="14" fill="#3fae6a" class="thin"/><text x="200" y="42" text-anchor="middle" class="h" font-size="16" style="fill:#fff">NEW</text>
    <text x="22" y="134" class="h" font-size="24">IRIVIOCIo</text>
    <text x="22" y="156" class="m" font-size="14">0.1.0-alpha.1</text>
    <g class="b" font-size="16"><text x="22" y="192">• debounced inputs</text><text x="22" y="220">• 5 kHz pulse counters</text><text x="22" y="248">• 4–20 mA / 0–10 V</text><text x="22" y="276">• wire-break detection</text><text x="22" y="304">• buzzer patterns</text></g>
  </g>
  <!-- card 3 -->
  <g transform="translate(604 80)">
    <rect width="264" height="318" rx="20" fill="#fff" class="ink"/>
    <rect x="0" y="0" width="264" height="96" rx="20" fill="#e9f1f4" class="ink"/>
    <rect x="16" y="70" width="232" height="26" fill="#e9f1f4"/>
    <g transform="translate(58 50)"><path d="M-22 -18 h44 v26 h-10 v10 h-24 v-10 h-10 z" fill="#fff" class="thin"/><path d="M-12 -10 v6 M-4 -10 v6 M4 -10 v6 M12 -10 v6" class="thin"/></g>
    <rect x="132" y="22" width="108" height="28" rx="14" fill="#2f6a7d" class="thin"/><text x="186" y="42" text-anchor="middle" class="h" font-size="16" style="fill:#fff">EXTENDED</text>
    <text x="22" y="134" class="h" font-size="24">IRIVIOCHardware</text>
    <text x="22" y="156" class="m" font-size="14">0.2.0-alpha.1</text>
    <g class="b" font-size="16"><text x="22" y="192">• W5500 Ethernet</text><text x="22" y="220">• DHCP or static IP</text><text x="22" y="248">• strict IPv4 parser</text><text x="22" y="276">• LittleFS settings</text></g>
  </g>
  <!-- card 4 -->
  <g transform="translate(888 80)">
    <rect width="264" height="318" rx="20" fill="#fff" class="ink"/>
    <rect x="0" y="0" width="264" height="96" rx="20" fill="#f8ede4" class="ink"/>
    <rect x="16" y="70" width="232" height="26" fill="#f8ede4"/>
    <g transform="translate(58 54)"><path d="M-26 12 a14 14 0 0 1 2 -26 a18 18 0 0 1 34 -6 a14 14 0 0 1 20 16 a12 12 0 0 1 -2 16 z" fill="#fff" class="thin"/></g>
    <rect x="160" y="22" width="80" height="28" rx="14" fill="#a3562a" class="thin"/><text x="200" y="42" text-anchor="middle" class="h" font-size="16" style="fill:#fff">OURS</text>
    <text x="22" y="134" class="h" font-size="24">WilcoxonMqtt</text>
    <text x="22" y="156" class="m" font-size="14">0.1.0-alpha.1</text>
    <g class="b" font-size="16"><text x="22" y="192">• MQTT 3.1.1 client</text><text x="22" y="220">• QoS 0 publish</text><text x="22" y="248">• QoS 0/1 subscribe</text><text x="22" y="276">• replaces PubSubClient</text></g>
  </g>
</svg>
